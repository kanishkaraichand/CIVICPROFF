<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixComplain — Tamper-Proof Civic Complaints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b18; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --txt:#e8edf7; --dim:#93a0b8;
  --cyan:#22d3ee; --indigo:#818cf8; --lime:#a3e635; --amber:#fbbf24; --coral:#fb7185; --red:#f87171;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Sora',system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
/* ambient blobs */
.blob{position:fixed;border-radius:50%;filter:blur(130px);opacity:.22;pointer-events:none;z-index:0}
.b1{width:520px;height:520px;background:#0ea5e9;top:-160px;left:-120px;animation:fl 16s ease-in-out infinite}
.b2{width:460px;height:460px;background:#6366f1;top:30%;right:-160px;animation:fl 19s ease-in-out infinite reverse}
.b3{width:400px;height:400px;background:#10b981;bottom:-140px;left:30%;animation:fl 22s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:0 22px}
/* nav */
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px);background:rgba(7,11,24,.72);border-bottom:1px solid var(--line)}
.navin{max-width:1160px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;gap:9px;letter-spacing:-.02em}
.logo .badge{font-size:.55rem;background:linear-gradient(90deg,var(--cyan),var(--indigo));padding:3px 8px;border-radius:99px;font-weight:700;letter-spacing:.08em}
.nlinks{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nlink{padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--dim);font-size:.88rem;font-weight:600;border:1px solid transparent;transition:.2s}
.nlink:hover{color:var(--txt);background:var(--panel)}
.nlink.on{color:var(--txt);background:var(--panel);border-color:var(--line)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--dim);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.8rem;font-family:inherit;transition:.2s}
.seg button.on{background:linear-gradient(90deg,rgba(34,211,238,.25),rgba(129,140,248,.25));color:var(--txt)}
/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:.88rem;padding:12px 22px;border-radius:12px;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:linear-gradient(90deg,#22d3ee,#818cf8);color:#06121f;box-shadow:0 8px 28px rgba(34,211,238,.3)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(34,211,238,.42)}
.btn.lime{background:linear-gradient(90deg,#a3e635,#34d399);color:#0a1a08}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--txt)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.danger{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:var(--red)}
.btn.sm{padding:9px 15px;font-size:.8rem;border-radius:10px}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--dim)}
.chip.cy{color:var(--cyan);border-color:rgba(34,211,238,.4)} .chip.lm{color:var(--lime);border-color:rgba(163,230,53,.4)}
.chip.am{color:var(--amber);border-color:rgba(251,191,36,.4)} .chip.co{color:var(--coral);border-color:rgba(251,113,133,.4)}
.hashchip{font-family:var(--mono);font-size:.68rem;color:var(--cyan);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);padding:3px 8px;border-radius:7px;cursor:pointer;transition:.2s}
.hashchip:hover{background:rgba(34,211,238,.18)}
/* hero */
.hero{padding:96px 0 60px;text-align:center}
.kicker{display:inline-flex;gap:8px;align-items:center;font-size:.78rem;font-weight:700;letter-spacing:.14em;color:var(--cyan);border:1px solid rgba(34,211,238,.35);padding:8px 18px;border-radius:99px;background:rgba(34,211,238,.06);margin-bottom:26px}
h1{font-size:clamp(2.3rem,5.6vw,4rem);font-weight:800;line-height:1.08;letter-spacing:-.03em;max-width:900px;margin:0 auto 22px}
.grad{background:linear-gradient(90deg,#22d3ee,#818cf8,#a3e635);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:1.06rem;max-width:660px;margin:0 auto 34px;line-height:1.7}
.hero .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
/* chain preview */
.chainprev{display:flex;gap:0;align-items:stretch;justify-content:center;margin:56px auto 0;flex-wrap:wrap}
.cb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:150px;text-align:left}
.cb .t{font-size:.68rem;font-weight:700;letter-spacing:.06em;margin-bottom:6px}
.cb .hx{font-family:var(--mono);font-size:.6rem;color:var(--dim)}
.carr{display:flex;align-items:center;padding:0 8px;color:var(--dim);font-size:1.1rem}
/* sections */
section{padding:54px 0}
h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.lead{color:var(--dim);max-width:640px;line-height:1.7;margin-bottom:30px}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.vs .card{border-top:3px solid}
.old{border-top-color:var(--coral)!important}.new{border-top-color:var(--lime)!important}
.step{display:flex;gap:14px;margin-bottom:18px}
.step .n{flex:0 0 34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(129,140,248,.2));border:1px solid var(--line)}
.story3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.scard .em{font-size:1.6rem;margin-bottom:10px}
.scard h4{font-size:.95rem;margin-bottom:6px}
.scard p{font-size:.82rem;color:var(--dim);line-height:1.6}
.bad{border-left:3px solid var(--coral)}.good{border-left:3px solid var(--lime)}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat .v{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:.72rem;color:var(--dim);font-weight:600;letter-spacing:.06em;margin-top:4px}
.ccard{cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.ccard:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.45);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.ccard .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ccard h3{font-size:1.02rem;margin-bottom:8px}
.prog{height:7px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));border-radius:99px;transition:width .6s}
/* pills */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:700;padding:6px 12px;border-radius:99px;letter-spacing:.04em}
.pill i{width:7px;height:7px;border-radius:50%;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 currentColor}50%{box-shadow:0 0 0 5px transparent}}
.p-SUBMITTED{background:rgba(251,191,36,.12);color:var(--amber)}.p-SUBMITTED i{background:var(--amber)}
.p-ACKNOWLEDGED{background:rgba(34,211,238,.12);color:var(--cyan)}.p-ACKNOWLEDGED i{background:var(--cyan)}
.p-IN_PROGRESS{background:rgba(129,140,248,.14);color:var(--indigo)}.p-IN_PROGRESS i{background:var(--indigo)}
.p-PENDING_CONFIRMATION{background:rgba(251,191,36,.12);color:var(--amber)}.p-PENDING_CONFIRMATION i{background:var(--amber)}
.p-RESOLVED{background:rgba(163,230,53,.13);color:var(--lime)}.p-RESOLVED i{background:var(--lime)}
.p-REOPENED{background:rgba(251,113,133,.13);color:var(--coral)}.p-REOPENED i{background:var(--coral)}
/* complaint detail */
.route{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.route .rn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:.82rem;font-weight:600}
.route .ra{color:var(--cyan);font-size:1rem}
/* photos */
.photos{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.pshot{width:200px}
.ptile{aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center}
.ptile img{width:100%;height:100%;object-fit:cover}
.ptile .em{font-size:3rem}
.pmeta{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.pmeta .chip{align-self:flex-start}
/* timeline */
.tl{list-style:none;position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--cyan),var(--indigo),var(--lime))}
.tl li{position:relative;padding:0 0 22px 8px}
.tl li::before{content:'';position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.t-SUBMITTED{background:var(--amber)}.t-ACKNOWLEDGED{background:var(--cyan)}.t-IN_PROGRESS{background:var(--indigo)}
.t-PROOF_UPLOADED,.t-PENDING_CONFIRMATION{background:var(--amber)}.t-CONFIRMED,.t-RESOLVED{background:var(--lime)}
.t-REOPENED{background:var(--coral)}.t-REJECTED{background:var(--red)}
.tl .lb{font-weight:700;font-size:.92rem}
.tl .mt{font-size:.75rem;color:var(--dim);margin:4px 0 7px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ledger */
.chain{display:flex;gap:14px;overflow-x:auto;padding:12px 4px 22px}
.chain .blk{flex:0 0 225px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.2s;position:relative}
.chain .blk:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.5)}
.chain .blk::after{content:'→';position:absolute;right:-16px;top:45%;color:var(--dim);font-size:.9rem}
.chain .blk:last-child::after{display:none}
.blk .bn{font-family:var(--mono);font-size:.65rem;color:var(--dim)}
.blk .bl{font-weight:700;font-size:.82rem;margin:8px 0 6px;line-height:1.35}
.blk .bh{font-family:var(--mono);font-size:.6rem;word-break:break-all;line-height:1.5}
.b-SUBMITTED{border-top:3px solid var(--amber)}.b-ACKNOWLEDGED{border-top:3px solid var(--cyan)}
.b-IN_PROGRESS{border-top:3px solid var(--indigo)}.b-PROOF_UPLOADED{border-top:3px solid var(--amber)}
.b-CONFIRMED{border-top:3px solid var(--lime)}.b-RESOLVED{border-top:3px solid var(--lime)}
.b-REOPENED{border-top:3px solid var(--coral)}.b-REJECTED{border-top:3px solid var(--red)}
/* modal */
#modalWrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#modalWrap.open{display:flex}
.ovl{position:absolute;inset:0;background:rgba(4,7,16,.7);backdrop-filter:blur(6px)}
.mbox{position:relative;background:#0d1326;border:1px solid var(--line);border-radius:22px;padding:30px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.compare>div{text-align:center}
@media(max-width:560px){.compare{grid-template-columns:1fr}}
input,textarea,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;color:var(--txt);padding:12px 14px;font-family:inherit;font-size:.9rem;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
label.f{font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--dim);display:block;margin:14px 0 6px}
.catgrid{display:flex;gap:8px;flex-wrap:wrap}
.catb{padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:.82rem;font-weight:600;color:var(--dim);transition:.2s}
.catb.on{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.08)}
/* toast */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;width:min(92vw,520px)}
.toast{background:#10182e;border:1px solid var(--line);border-radius:14px;padding:14px 20px;font-size:.86rem;font-weight:600;box-shadow:0 16px 50px rgba(0,0,0,.5);animation:tin .3s ease;width:100%;text-align:center}
.toast.ok{border-color:rgba(163,230,53,.5)}.toast.err{border-color:rgba(248,113,113,.55)}
@keyframes tin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
footer{padding:44px 0 60px;text-align:center;color:var(--dim);font-size:.78rem;line-height:1.8}
@media(max-width:700px){.hero{padding:64px 0 40px}.card{padding:20px}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<nav><div class="navin">
  <div class="logo" onclick="go('landing')">🛠️ FixComplain <span class="badge">TAMPER-PROOF</span></div>
  <div class="nlinks">
    <div class="nlink" id="nl-landing" onclick="go('landing')">Story</div>
    <div class="nlink" id="nl-dashboard" onclick="go('dashboard')">Dashboard</div>
    <div class="nlink" id="nl-ledger" onclick="go('ledger')">Ledger</div>
    <div class="seg" title="Demo role simulation">
      <button id="r-citizen" onclick="setRole('citizen')">🙋 Citizen</button>
      <button id="r-worker" onclick="setRole('worker')">👷 Worker</button>
      <button id="r-neighbor" onclick="setRole('neighbor')">🧑‍🤝‍🧑 Neighbor</button>
    </div>
  </div>
</div></nav>

<div class="wrap" id="app"></div>

<footer id="foot">
  FixComplain — a frontend concept demo · the "shared ledger" is simulated on this device (no backend, no real blockchain network).<br>
  Inspired by the village notebook 📓 and UPI-as-shared-plumbing 🪈 ideas.
</footer>

<div id="modalWrap"><div class="ovl" onclick="closeModal()"></div><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function hashHex(str){const g=xmur3('fc:'+str);let o='';for(let i=0;i<8;i++)o+=g().toString(16).padStart(8,'0');return o} // 64-hex demo hash
const fmt=ts=>new Date(ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const D=86400000,H=36e5;

const ACTORS={
  citizen:{id:'CZN-7Q2K',name:'Priya · verified citizen'},
  neighbor:{id:'CZN-3M8V',name:'Neighbor · verified citizen'},
  worker:{id:'WRK-9021',name:'Roads crew'}
};
const CATS={
  pothole:{em:'🕳️',dept:'Roads & Infrastructure'},
  streetlight:{em:'💡',dept:'Electricity Board'},
  water:{em:'💧',dept:'Water Board'},
  garbage:{em:'🗑️',dept:'Sanitation Dept'},
  other:{em:'📌',dept:'Municipal General'}
};
const NEED=2; // independent confirmations to resolve

/* ============ state ============ */
let S=null;
const KEY='fixcomplain_v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){}
  seed();
}
function resetDemo(){localStorage.removeItem(KEY);seed();toast('Demo reset — fresh seed data loaded','ok');go('landing')}

function prevHash(){return S.ledger.length?S.ledger[S.ledger.length-1].hash:'0'.repeat(64)}
function addEvent(c,type,label,actor,ts){
  ts=ts||Date.now();
  const p=prevHash();
  const payload=JSON.stringify({i:S.ledger.length,type,label,cid:c.id,actor,ts,prev:p});
  const hash=hashHex(payload);
  const li=S.ledger.length;
  S.ledger.push({i:li,ts,type,label,complaint:c.id,actor,prev:p,hash});
  c.events.push({type,label,actor,ts,hash,prev:p,li});
  return li;
}

function seed(){
  const now=Date.now();
  S={view:'landing',cid:null,role:'citizen',ledger:[],complaints:[]};
  const demoPhoto=(em,g)=>({dataUrl:null,emoji:em,grad:g});

  // C1 — Priya's pothole: proof uploaded, 1 of 2 confirmations (user completes the arc)
  const c1={id:'c1',cat:'pothole',title:'Deep pothole flooding after rain — MG Road, near bus stop',
    desc:'Three weeks old, nearly a foot deep. Fills with water and is invisible until a scooter hits it.',
    loc:{label:'MG Road, Ward 14',lat:12.9716,lng:77.5946},
    status:'PENDING_CONFIRMATION',reporter:ACTORS.citizen.id,
    photos:[{...demoPhoto('🕳️','linear-gradient(135deg,#1e293b,#3f2d20)'),type:'original',meta:{gps:'Pin verified',time:now-21*D}}],
    confirms:[],events:[]};
  addEvent(c1,'SUBMITTED','Complaint filed & written to shared ledger','CZN-7Q2K',now-21*D-2*H);
  addEvent(c1,'ACKNOWLEDGED','Acknowledged by Roads & Infrastructure','WRK-9021',now-19*D);
  addEvent(c1,'IN_PROGRESS','Repair crew scheduled','WRK-9021',now-17*D);
  addEvent(c1,'PROOF_UPLOADED','Geotagged repair proof attached (GPS ✓ · within 18m of pin)','WRK-9021',now-6*D);
  c1.photos.push({...demoPhoto('🚧','linear-gradient(135deg,#14532d,#166534)'),type:'proof',meta:{gps:'GPS ✓ · 18m from pin',time:now-6*D}});
  addEvent(c1,'CONFIRMED','Confirmed by neighbor CZN-5TQ (independent)','CZN-5TQ',now-5*D);
  c1.confirms.push({by:'CZN-5TQ',role:'neighbor',at:now-5*D});
  S.complaints.push(c1);

  // C2 — streetlight, in progress
  const c2={id:'c2',cat:'streetlight',title:'Streetlight dark for 10 days — park entrance',
    desc:'Whole stretch is unlit at night; women avoiding the shortcut after 8pm.',
    loc:{label:'Nehru Park Gate 2, Ward 14',lat:12.9739,lng:77.5901},
    status:'IN_PROGRESS',reporter:ACTORS.neighbor.id,photos:[],confirms:[],events:[]};
  addEvent(c2,'SUBMITTED','Complaint filed & written to shared ledger','CZN-3M8V',now-9*D);
  addEvent(c2,'ACKNOWLEDGED','Acknowledged by Electricity Board','WRK-9021',now-8*D);
  addEvent(c2,'IN_PROGRESS','Electrician assigned, parts ordered','WRK-9021',now-7*D);
  S.complaints.push(c2);

  // C3 — water leak, just submitted
  const c3={id:'c3',cat:'water',title:'Continuous water leak from pipeline joint',
    desc:'Drinking water wasting for two days at the street corner.',
    loc:{label:'12th Cross, Ward 14',lat:12.9702,lng:77.5971},
    status:'SUBMITTED',reporter:ACTORS.citizen.id,photos:[],confirms:[],events:[]};
  addEvent(c3,'SUBMITTED','Complaint filed & written to shared ledger','CZN-7Q2K',now-1*D);
  S.complaints.push(c3);

  save();
}

/* ============ toasts & modal ============ */
function toast(msg,kind){
  const t=document.createElement('div');t.className='toast '+(kind||'');t.innerHTML=msg;
  $('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.4s';setTimeout(()=>t.remove(),400)},3600);
}
function openModal(html){$('#mbox').innerHTML=html;$('#modalWrap').classList.add('open')}
function closeModal(){$('#modalWrap').classList.remove('open')}

/* ============ navigation ============ */
function go(v){S.view=v;if(v!=='complaint')S.cid=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}

/* ============ photo handling ============ */
function readPhoto(file,cb){
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');const s=Math.min(1,480/Math.max(img.width,img.height));
    c.width=img.width*s;c.height=img.height*s;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',.72));
  };img.src=e.target.result};
  rd.readAsDataURL(file);
}
function simDistance(){return 15+Math.floor(Math.random()*14)} // 15–28 m

function confirmFix(cid){
  const c=get(cid),a=ACTORS[S.role];
  if(c.confirms.some(x=>x.by===a.id))return toast('You already confirmed this one','err');
  c.confirms.push({by:a.id,role:S.role,at:Date.now()});
  addEvent(c,'CONFIRMED',`Confirmed by ${a.name} (independent eyewitness)`,a.id);
  if(c.confirms.length>=NEED){
    c.status='RESOLVED';
    addEvent(c,'RESOLVED',`Status changed to RESOLVED — proof verified + ${NEED} independent confirmations`,'protocol');
    toast(`✅ <b>Resolved — for real this time.</b> Proof + ${NEED} eyewitness confirmations, all permanently on the ledger.`,'ok');
  }else toast(`Confirmation recorded — ${c.confirms.length} of ${NEED}. Needs ${NEED-c.confirms.length} more independent confirmation${NEED-c.confirms.length>1?'s':''}.`,'ok');
  save();render();
}

function statusActions(c){
  const r=S.role,W='WRK-9021';
  const b=[];
  if(r==='worker'&&c.status!=='RESOLVED'&&c.status!=='REOPENED'){
    if(c.status==='SUBMITTED')b.push(`<button class="btn primary sm" onclick="ack('${c.id}')">✅ Acknowledge</button>`);
    if(c.status==='ACKNOWLEDGED')b.push(`<button class="btn primary sm" onclick="startWork('${c.id}')">🔧 Start repair</button>`);
    if(c.status==='IN_PROGRESS')b.push(`<button class="btn primary sm" onclick="uploadProofModal('${c.id}')">📷 Upload geotagged proof</button>`);
    if(c.status==='PENDING_CONFIRMATION')b.push(`<span class="chip am">Awaiting ${NEED-c.confirms.length} more citizen confirmation${NEED-c.confirms.length>1?'s':''}</span>`);
    b.push(`<button class="btn danger sm" onclick="tryForceResolve('${c.id}')">⚡ Try to force-resolve (no proof)</button>`);
  }
  if((r==='citizen'||r==='neighbor')&&c.status==='PENDING_CONFIRMATION'){
    const mine=c.confirms.some(x=>x.by===ACTORS[r].id);
    b.push(mine?`<span class="chip lm">✓ You confirmed — eyes on the street</span>`
      :`<button class="btn lime sm" onclick="confirmFix('${c.id}')">👁️ I've seen it — it IS fixed</button>`);
  }
  if(r==='citizen'&&(c.status==='RESOLVED'||c.status==='REOPENED'))
    b.push(`<button class="btn ghost sm" onclick="reopenStart('${c.id}')">🔁 Broken again — report with photo</button>`);
  return b.length?`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">${b.join('')}</div>`:'';
}

function render(){
  ['landing','dashboard','ledger'].forEach(v=>{const el=$('#nl-'+v);if(el)el.classList.toggle('on',S.view===v||(v==='landing'&&S.view==='complaint'))});
  ['citizen','worker','neighbor'].forEach(r=>$('#r-'+r).classList.toggle('on',S.role===r));
  const app=$('#app');
  if(S.view==='landing')app.innerHTML=vLanding();
  else if(S.view==='dashboard')app.innerHTML=vDash();
  else if(S.view==='ledger')app.innerHTML=vLedger();
  else if(S.view==='complaint')app.innerHTML=vComplaint(get(S.cid));
}

      <h3>${esc(c.title)}</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip cy">🏛️ ${CATS[c.cat].dept}</span><span class="chip">📍 ${esc(c.loc.label)}</span><span class="chip mono">🆔 ${c.reporter}</span></div>
      ${c.status==='PENDING_CONFIRMATION'||c.status==='RESOLVED'?`<div class="prog"><i style="width:${pct}%"></i></div><span class="dim" style="font-size:.72rem">👁️ ${c.confirms.length}/${NEED} independent confirmations</span>`:''}
      <div style="margin-top:14px"><span class="hashchip">🔗 ${c.events.length} ledger entries</span></div>
    </div>`}).join('')}
  </div>
</section>`;}

function vComplaint(c){
  if(!c)return '<section class="card">Not found.</section>';
  const pct=Math.min(100,(c.confirms.length/NEED)*100);
  return `
<section style="padding-top:44px">
  <div class="nlink" style="display:inline-block;margin-bottom:16px" onclick="go('dashboard')">← All complaints</div>
  <div class="card" style="margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start">
      <div><div style="font-size:2rem">${CATS[c.cat].em}</div>
        <h2 style="margin:10px 0 8px">${esc(c.title)}</h2>
        <p class="dim" style="max-width:640px;line-height:1.7">${esc(c.desc)}</p></div>
      ${pill(c.status)}
    </div>
    <div class="route">
      <div class="rn">📝 ${esc(c.loc.label)}</div><span class="ra">→</span>
      <div class="rn">🔗 Shared ledger</div><span class="ra">→</span>
      <div class="rn" style="border-color:rgba(34,211,238,.5);color:var(--cyan)">${CATS[c.cat].dept}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="chip mono">🆔 reporter ${c.reporter}</span>
      <span class="chip lm">🔒 pseudonymous — identity never public</span>
      <span class="chip">📍 ${c.loc.lat.toFixed(4)}, ${c.loc.lng.toFixed(4)}</span>
    </div>
    ${c.photos.length?`<div class="photos">${c.photos.map(p=>photoTile(p,p.type==='original'?'Original complaint':p.type==='proof'?'Repair proof':'Reopened — new photo')).join('')}</div>`:''}
  </div>

  <div class="grid3" style="grid-template-columns:1.15fr .85fr">
    <div class="card">
      <h3 style="margin-bottom:20px">📜 The whole real story — every page permanent</h3>
      <ul class="tl">${c.events.map(e=>`<li><span class="t-${e.type}"></span>
        <div class="lb">${esc(e.label)}</div>
        <div class="mt"><span>👤 ${esc(e.actor)}</span><span>🕒 ${fmt(e.ts)}</span>
        <span class="hashchip" onclick="showBlock(${e.li})">🔗 ${e.hash.slice(0,10)}…</span></div></li>`).join('')}</ul>
    </div>
    <div>
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:8px">👁️ Resolution gate</h3>
        <p class="dim" style="font-size:.82rem;line-height:1.6;margin-bottom:14px">No one — no official, no button — can mark this resolved without <b>photo proof + ${NEED} independent confirmations</b>.</p>
        <div class="prog" style="margin:0 0 8px"><i style="width:${pct}%"></i></div>
        <div class="dim" style="font-size:.8rem;margin-bottom:12px">${c.confirms.length} of ${NEED} independent confirmations</div>
        ${c.confirms.map(x=>`<span class="chip lm" style="margin:0 6px 6px 0">✓ ${x.by}</span>`).join('')}
        ${statusActions(c)}
      </div>
      <div class="card">
        <h3 style="margin-bottom:8px">🧭 How this demo works</h3>
        <p class="dim" style="font-size:.82rem;line-height:1.7">Switch roles in the header: as the <b>Worker</b>, try "force-resolve" — the protocol blocks it and logs the attempt. As <b>Priya</b> or a <b>Neighbor</b>, confirm with your own eyes. If it breaks again, the app checks the spot and <i>asks you</i> whether it's the same pothole.</p>
      </div>
    </div>
  </div>
</section>`;}

function vLedger(){
  const counts={};S.ledger.forEach(b=>counts[b.type]=(counts[b.type]||0)+1);
  return `
<section style="padding-top:44px">
  <h2>🔗 The shared ledger — every household's copy</h2>
  <p class="lead" style="margin-bottom:20px">Each block seals the one before it. Rewriting history breaks every hash after it — all copies would disagree. Click any block to verify its hash.</p>
  <div class="stats">
    <div class="stat"><div class="v" style="color:var(--cyan)">${S.ledger.length}</div><div class="l">TOTAL BLOCKS</div></div>
    ${Object.entries(counts).filter(([k])=>k!=='SUBMITTED'&&k!=='ACKNOWLEDGED').slice(0,4).map(([k,v])=>`<div class="stat"><div class="v">${v}</div><div class="l">${k.replace(/_/g,' ')}</div></div>`).join('')}
  </div>
  <div class="chain">${S.ledger.map(b=>`
    <div class="blk b-${b.type}" onclick="showBlock(${b.i})">
      <div class="bn">BLOCK #${b.i} · ${b.type}</div>
      <div class="bl">${esc(b.label.length>70?b.label.slice(0,70)+'…':b.label)}</div>
      <div class="dim" style="font-size:.68rem;margin-bottom:6px">complaint ${b.complaint} · ${esc(b.actor)}<br>${fmt(b.ts)}</div>
      <div class="bh" style="color:var(--dim)">prev ${b.prev.slice(0,8)}…</div>
      <div class="bh" style="color:var(--cyan)">hash ${b.hash.slice(0,8)}…</div>
    </div>`).join('')}
  </div>
  <p class="dim" style="font-size:.76rem;margin-top:6px">← scroll the chain → · Demo note: this is a single-device simulation of a replicated, append-only ledger — same guarantees, no network.</p>
</section>`;}

/* boot */
load();render();
</script>
</body>
</html>
